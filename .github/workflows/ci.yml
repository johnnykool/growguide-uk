name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # tsc covers the test files too, which next build does not reach.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # No secrets: every API key is read at request time by a dynamic route,
      # so a build with none of them set still produces all 17 pages.
      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Reads package-lock.json directly, so there is nothing to install
      # and nothing worth caching.
      # The gate checks against scripts/audit-baseline.json rather than a
      # severity threshold: anything critical, anything not already reviewed,
      # and any escalation of a known issue all fail. A plain --audit-level
      # would either be red every day or miss what it is meant to catch.
      - name: Audit gate
        run: node scripts/audit-gate.mjs

      - name: Full report
        if: always()
        run: npm audit || true
